<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charybdis Live — UI direction</title>
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Charybdis Live — visual direction
   Rule of the system: the interface is black and white. Every hue on screen
   is a colour the keyboard actually emits — layer light, pointing-mode light,
   feedback light. Nothing else is allowed to be coloured.
   ───────────────────────────────────────────────────────────────────────── */
:root {
  --bg: #08080a;
  --bg-deep: #050506;
  --surface: #0f0f12;
  --surface-2: #151519;
  --surface-3: #1c1c21;
  --key: #17171b;
  --key-hi: #23232a;
  --line: rgba(255,255,255,.085);
  --line-2: rgba(255,255,255,.14);
  --line-3: rgba(255,255,255,.26);
  --text: #f5f5f6;
  --text-2: #9a9aa4;
  --text-3: #626270;
  --inv-bg: #ffffff;
  --inv-text: #0a0a0c;
  --draft: #e3b341;
  --danger: #ff6b5e;
  --shadow: 0 1px 2px rgba(0,0,0,.6), 0 12px 32px rgba(0,0,0,.45);
  --radius: 10px;
  --radius-s: 7px;
  --rail: 232px;
  --inspector: 404px;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  --sans: -apple-system, "SF Pro Text", "Inter", system-ui, "Segoe UI", sans-serif;
}
:root[data-theme="light"] {
  --bg: #f4f4f2;
  --bg-deep: #ececea;
  --surface: #ffffff;
  --surface-2: #fafaf9;
  --surface-3: #f1f1ef;
  --key: #ffffff;
  --key-hi: #f0f0ee;
  --line: rgba(0,0,0,.10);
  --line-2: rgba(0,0,0,.16);
  --line-3: rgba(0,0,0,.34);
  --text: #0c0c0e;
  --text-2: #5b5b64;
  --text-3: #8b8b95;
  --inv-bg: #0c0c0e;
  --inv-text: #ffffff;
  --draft: #9a6b00;
  --danger: #c0392b;
  --shadow: 0 1px 2px rgba(0,0,0,.08), 0 10px 30px rgba(0,0,0,.08);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.006em;
}
h1, h2, h3, h4 { margin: 0; font-weight: 560; letter-spacing: -0.018em; }
p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0; }
.muted { color: var(--text-2); }
.dim { color: var(--text-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ── shell ───────────────────────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  height: 100vh;
  overflow: hidden;
}
.rail {
  display: flex;
  flex-direction: column;
  background: var(--bg-deep);
  border-right: 1px solid var(--line);
  min-height: 0;
}
.rail-device {
  padding: 18px 18px 16px;
  border-bottom: 1px solid var(--line);
}
.rail-mark {
  display: flex; align-items: center; gap: 9px;
  font-size: 13px; font-weight: 600; letter-spacing: -0.02em;
}
.mark-glyph {
  width: 22px; height: 22px; border-radius: 6px;
  background: var(--inv-bg); color: var(--inv-text);
  display: grid; place-items: center;
  font-family: var(--mono); font-size: 11px; font-weight: 700;
}
.rail-product { margin-top: 12px; font-size: 12.5px; font-weight: 520; }
.rail-meta { margin-top: 3px; font-size: 11px; color: var(--text-3); font-family: var(--mono); }
.rail-status { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.stat { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--text-2); }
.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-3); flex: none; }
.dot.on { background: var(--text); }
.dot.draft { background: var(--draft); }
.dot.err { background: var(--danger); }
.rail-nav { padding: 10px 10px; display: flex; flex-direction: column; gap: 1px; overflow-y: auto; flex: 1; min-height: 0; }
.rail-group { padding: 14px 8px 6px; font-size: 10px; letter-spacing: .11em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
.nav-item {
  display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 10px;
  padding: 8px 9px; border-radius: var(--radius-s);
  color: var(--text-2); font-size: 13px; text-align: left; width: 100%;
  transition: background .12s ease, color .12s ease;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item[aria-current="true"] { background: var(--surface-3); color: var(--text); font-weight: 520; }
.nav-item svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.4; opacity: .85; }
.nav-count { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
.nav-item[aria-current="true"] .nav-count { color: var(--text-2); }
.rail-foot { padding: 12px; border-top: 1px solid var(--line); display: flex; gap: 8px; }

/* ── main ────────────────────────────────────────────────────────────── */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.topbar {
  display: flex; align-items: flex-start; gap: 20px;
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--line);
}
.topbar h1 { font-size: 19px; }
.topbar .sub { margin-top: 3px; font-size: 12px; color: var(--text-2); max-width: 62ch; }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
.content { flex: 1; overflow: auto; min-height: 0; }
.pad { padding: 20px 24px 120px; }

/* ── controls ────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  height: 30px; padding: 0 12px; border-radius: var(--radius-s);
  border: 1px solid var(--line-2); color: var(--text);
  font-size: 12.5px; font-weight: 500; white-space: nowrap;
  background: var(--surface-2);
  transition: background .12s ease, border-color .12s ease, opacity .12s ease;
}
.btn:hover { background: var(--surface-3); border-color: var(--line-3); }
.btn.ghost { background: none; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.primary { background: var(--inv-bg); color: var(--inv-text); border-color: transparent; font-weight: 560; }
.btn.primary:hover { opacity: .88; background: var(--inv-bg); }
.btn.tiny { height: 24px; padding: 0 9px; font-size: 11.5px; border-radius: 6px; }
.btn.icon { width: 30px; padding: 0; justify-content: center; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.5; }

.seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; }
.seg button {
  height: 24px; padding: 0 11px; border-radius: 6px; font-size: 12px; color: var(--text-2);
}
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); font-weight: 520; box-shadow: 0 1px 0 rgba(0,0,0,.25); }

.field { display: grid; gap: 6px; }
.field > span, .label { font-size: 11px; color: var(--text-2); letter-spacing: .01em; }
.input, select.input {
  height: 32px; padding: 0 10px; width: 100%;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-s);
  color: var(--text); font-size: 12.5px; outline: none;
  transition: border-color .12s ease, background .12s ease;
  appearance: none;
}
.input:focus { border-color: var(--line-3); background: var(--surface-3); }
.input.mono { font-family: var(--mono); font-size: 12px; }
select.input { background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%); background-position: calc(100% - 15px) 14px, calc(100% - 10px) 14px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
.input-row { display: flex; gap: 6px; }
.input-row .input { flex: 1; }

.sw { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; }
.sw input { position: absolute; opacity: 0; pointer-events: none; }
.sw .track {
  width: 30px; height: 18px; border-radius: 9px; background: var(--surface-3);
  border: 1px solid var(--line-2); position: relative; transition: background .15s ease, border-color .15s ease;
  flex: none;
}
.sw .track::after {
  content: ""; position: absolute; inset: 2px auto 2px 2px; width: 12px; border-radius: 50%;
  background: var(--text-3); transition: transform .15s cubic-bezier(.3,.8,.3,1), background .15s ease;
}
.sw input:checked + .track { background: var(--inv-bg); border-color: transparent; }
.sw input:checked + .track::after { transform: translateX(12px); background: var(--inv-text); }
.sw .txt { font-size: 12.5px; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px;
  border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line);
  font-size: 11px; color: var(--text-2);
}
.chip .mono { font-size: 10.5px; }
.tag { font-family: var(--mono); font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.card-h { display: flex; align-items: center; gap: 10px; padding: 13px 15px; border-bottom: 1px solid var(--line); }
.card-h h3 { font-size: 13px; }
.card-h .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.card-b { padding: 15px; }
.row { display: flex; align-items: center; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.stack { display: grid; gap: 14px; }
.hr { height: 1px; background: var(--line); margin: 14px -15px; }

/* ── layer strip ─────────────────────────────────────────────────────── */
.layerbar { display: flex; align-items: center; gap: 4px; padding: 10px 24px; border-bottom: 1px solid var(--line); background: var(--bg-deep); overflow-x: auto; }
.layer-chip {
  display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 11px 0 9px;
  border-radius: 7px; border: 1px solid transparent; color: var(--text-2); font-size: 12.5px; white-space: nowrap;
}
.layer-chip:hover { background: var(--surface-2); color: var(--text); }
.layer-chip[aria-pressed="true"] { background: var(--surface-3); border-color: var(--line-2); color: var(--text); font-weight: 520; }
.layer-chip .swatch { width: 9px; height: 9px; border-radius: 3px; border: 1px solid rgba(255,255,255,.18); flex: none; }
.layer-chip .idx { font-family: var(--mono); font-size: 10px; color: var(--text-3); }
.layer-chip.dirty::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--draft); }
.layer-chip.staged { border-style: dashed; border-color: var(--draft); }
.layerflow { display: flex; align-items: center; gap: 14px; padding: 11px 24px; border-bottom: 1px solid var(--line);
  background: var(--surface-2); }

/* ── board ───────────────────────────────────────────────────────────── */
.workspace { display: grid; grid-template-columns: minmax(0,1fr) var(--inspector); min-height: 0; }
.workspace.wide { grid-template-columns: minmax(0,1fr); }
.stage {
  position: relative; padding: 22px 24px 28px;
  display: flex; flex-direction: column; gap: 14px; min-width: 0;
}
.stage-head { display: flex; align-items: baseline; gap: 12px; }
.stage-head h2 { font-size: 15px; }
.stage-head .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.board {
  position: relative; border: 1px solid var(--line); border-radius: 14px;
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.035), transparent 60%),
    var(--surface);
  padding: 10px 14px 6px;
}
:root[data-theme="light"] .board { background: radial-gradient(120% 90% at 50% 0%, rgba(0,0,0,.02), transparent 60%), var(--surface); }
.board svg { display: block; width: 100%; height: auto; }
/* auto margins would stop a grid item stretching, so centre it explicitly */
.keys-pad .board { width: 100%; max-width: 900px; justify-self: center; }
.kc-rect { fill: var(--key); stroke: var(--line-2); stroke-width: 1; transition: fill .12s ease, stroke .12s ease; }
.kc:hover .kc-rect { fill: var(--key-hi); stroke: var(--line-3); }
.kc-label { fill: var(--text); font-family: var(--sans); font-size: 15px; font-weight: 500; text-anchor: middle; dominant-baseline: middle; letter-spacing: -.02em; }
.kc-label.sm { font-size: 12px; }
.kc-label.xs { font-size: 10.5px; font-family: var(--mono); }
.kc-sub { fill: var(--text-3); font-family: var(--mono); font-size: 9.5px; text-anchor: middle; }
.kc-trns .kc-label { fill: var(--text-3); }
.kc-trns .kc-rect { fill: transparent; stroke: var(--line); stroke-dasharray: 3 3; }
.kc-none .kc-rect { fill: transparent; stroke: var(--line); }
.kc.sel .kc-rect { stroke: var(--text); stroke-width: 2; fill: var(--key-hi); }
.board.picking { box-shadow: inset 0 0 0 1px var(--line-2); }
.kc.pickable { cursor: crosshair; }
.kc.pickable .kc-rect { stroke-dasharray: 0; }
.kc.input-on .kc-rect { fill: var(--key-hi); stroke: var(--text); stroke-width: 2; stroke-dasharray: 4 3; }
.kc.input-on .kc-label { fill: var(--text); }
.pickbar { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--line-2);
  border-radius: 9px; background: var(--surface-2); font-size: 12px; }
.pickbar .n { font-family: var(--mono); font-size: 11px; color: var(--text-2); }
.kc.sel .kc-label { fill: var(--text); }
.kc-mark { fill: var(--text-2); }
.kc-ring { fill: none; stroke: #fff; stroke-width: 2.4; }
:root[data-theme="light"] .kc-ring { stroke: #0c0c0e; }
.kc-inring { fill: none; stroke: #fff; stroke-width: 2; stroke-dasharray: 5 3.5; }
:root[data-theme="light"] .kc-inring { stroke: #0c0c0e; }
.kc-badge { fill: var(--text-3); font-family: var(--mono); font-size: 9px; text-anchor: middle; }
.kc-dotn { font-family: var(--mono); font-size: 5.6px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.kc-badgetext { fill: #f5f5f3; font-family: var(--mono); font-size: 5.8px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.legend-item .ldot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; border: 1px solid rgba(255,255,255,.5); }
.legend-item .lbadge { display: inline-grid; place-items: center; width: 17px; height: 11px; border-radius: 3px;
  border: 1px solid rgba(245,245,243,.7); background: rgba(8,8,10,.86); color: #f5f5f3;
  font-family: var(--mono); font-size: 7.5px; font-weight: 700; font-style: normal; }
.kc-led { opacity: .95; }
.kc-glow { filter: blur(7px); opacity: .5; }
.board-legend { display: flex; gap: 16px; padding: 8px 6px 4px; flex-wrap: wrap; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-3); }
.legend-item .m { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line-2); display: grid; place-items: center; }
.legend-item .m i { width: 4px; height: 4px; border-radius: 50%; background: var(--text-2); display: block; }

/* ── inspector ───────────────────────────────────────────────────────── */
.inspector {
  border-left: 1px solid var(--line); background: var(--surface);
  display: flex; flex-direction: column; min-height: 0;
}
.insp-head { padding: 16px 16px 13px; border-bottom: 1px solid var(--line); }
.insp-eyebrow { display: flex; align-items: center; gap: 8px; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
.insp-title { margin-top: 7px; display: flex; align-items: baseline; gap: 9px; }
.insp-title h3 { font-size: 17px; letter-spacing: -.02em; }
.insp-body { overflow: auto; padding: 4px 0 24px; flex: 1; }
.sect { border-bottom: 1px solid var(--line); padding: 15px 16px; }
.sect:last-child { border-bottom: 0; }
.sect-h { display: flex; align-items: center; gap: 8px; margin-bottom: 11px; }
.sect-h h4 { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
.sect-h .right { margin-left: auto; display: flex; gap: 6px; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 4px 10px; font-size: 12px; }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; font-family: var(--mono); font-size: 11.5px; }

/* ── behaviour timeline ──────────────────────────────────────────────── */
.branch { border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); overflow: hidden; }
.branch + .branch { margin-top: 8px; }
.branch-h { display: flex; align-items: center; gap: 9px; padding: 9px 11px; border-bottom: 1px solid var(--line); }
.branch-n { width: 19px; height: 19px; border-radius: 5px; background: var(--surface-3); border: 1px solid var(--line-2); display: grid; place-items: center; font-family: var(--mono); font-size: 10px; color: var(--text-2); }
.branch-h .t { font-size: 12px; font-weight: 520; }
.branch-h .right { margin-left: auto; }
.branch-b { padding: 4px 11px 10px; }
.tier { display: grid; grid-template-columns: 62px minmax(0,1fr) auto; gap: 8px; align-items: center;
  padding: 6px 4px; border-bottom: 1px dashed var(--line); width: 100%; text-align: left; border-radius: 6px; }
.tier:last-child { border-bottom: 0; }
button.tier:hover { background: var(--surface-3); }
.tier .tl { font-size: 11px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
.tier .tl::before { content: ""; width: 6px; height: 6px; border: 1px solid var(--line-3); border-radius: 2px; flex: none; }
.tier .tl.tap::before { background: var(--text-2); border-color: var(--text-2); }
.tier .tl.hold::before { border-radius: 50%; }
.tier .tl.long::before { border-radius: 50%; border-style: dashed; }
.tier .ta { display: flex; align-items: center; gap: 5px; min-width: 0; }
.tier .th { font-size: 10.5px; color: var(--text-3); white-space: nowrap; }
.tier.off { color: var(--text-3); }
.tier.off .ta { font-size: 11.5px; }
.tier.editing { grid-template-columns: 62px minmax(0,1fr); align-items: start; background: var(--surface-3); padding: 9px 8px; }
.tier-edit { display: grid; gap: 8px; }
.act { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 9px; border-radius: 6px; background: var(--surface-3); border: 1px solid var(--line); font-family: var(--mono); font-size: 11px; max-width: 100%; overflow: hidden; }
.act .k { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act .how { color: var(--text-3); font-family: var(--sans); font-size: 10.5px; }
.act.empty { border-style: dashed; color: var(--text-3); background: none; font-family: var(--sans); font-size: 11.5px; }
/* ── workbench ───────────────────────────────────────────────────────── */
.keys-pad { display: grid; gap: 18px; max-width: 1280px; }
.bench { overflow: hidden; }
.bench-tabs { display: flex; align-items: center; gap: 2px; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.bench-tabs button[role="tab"] {
  display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 13px;
  border-radius: 7px; font-size: 13px; color: var(--text-2); font-weight: 480;
}
.bench-tabs button[role="tab"]:hover { background: var(--surface-3); color: var(--text); }
.bench-tabs button[role="tab"][aria-selected="true"] { background: var(--bg); color: var(--text); font-weight: 560; box-shadow: inset 0 0 0 1px var(--line); }
.bench-tabs .c { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
.bench-tabs button[role="tab"][aria-selected="true"] .c { color: var(--text-2); }
.bench-right { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-right: 4px; }
.bench-body { padding: 16px 18px 20px; }
.tab-grid { display: grid; gap: 26px; }
.tab-grid.three { grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr) minmax(0, 1fr); }
.tab-grid.two { grid-template-columns: minmax(320px, 0.9fr) minmax(0, 1.1fr); }
.tab-grid .span { grid-column: 1 / -1; }
.tab-grid section { min-width: 0; }
.tab-split { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 20px; align-items: start; }
.tab-split.builder { grid-template-columns: 330px minmax(0, 1fr); }
.tab-split.wide { grid-template-columns: minmax(0, 1fr) 330px; }
.empty-card { border: 1px dashed var(--line-2); border-radius: 10px; padding: 16px; }

.rowlist { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface-2); }
.rowlist-h { padding: 9px 12px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); font-weight: 600; border-bottom: 1px solid var(--line); }
.rowitem { display: grid; gap: 2px; width: 100%; text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.rowitem:last-child { border-bottom: 0; }
.rowitem:hover { background: var(--surface-3); }
.rowitem.on { background: var(--surface-3); box-shadow: inset 2px 0 0 var(--text); }

function qmkRgb(h, s, v) {
  h = h * 360 / 255; s = s / 255; v = v / 255;

  let r = 0, g = 0, b = 0;
  if (h < 60) [r,g,b] = [c,x,0]; else if (h < 120) [r,g,b] = [x,c,0];
  else if (h < 180) [r,g,b] = [0,c,x]; else if (h < 240) [r,g,b] = [0,x,c];
  else if (h < 300) [r,g,b] = [x,0,c]; else [r,g,b] = [c,0,x];
  const f = n => Math.round((n + m) * 255);
  return `rgb(${f(r)}, ${f(g)}, ${f(b)})`;

  KC_PPLS:"+", KC_PMNS:"−", KC_PEQL:"=", KC_PDOT:".", KC_UP:"↑", KC_DOWN:"↓", KC_LEFT:"←", KC_RGHT:"→",

function keyFace(code) {
  if (code === _ ) return {main:"▽", sub:"", kind:"trns"};

  let m;
  if ((m = code.match(/^LT\((\d),(\w+)\)$/))) return {main: face(m[2]), sub: "L" + m[1], kind:"dual"};
  if ((m = code.match(/^MO\((\d)\)$/))) return {main: "L" + m[1], sub:"momentary", kind:"layer"};
  if ((m = code.match(/^VIA_MACRO_(\d+)$/))) return {main: "M" + m[1], sub:"macro", kind:"macro"};
  if ((m = code.match(/^G\((\w+)\)$/))) return {main: "⌘" + face(m[1]), sub:"", kind:"mod"};
  if ((m = code.match(/^LSG\((\w+)\)$/))) return {main: "⇧⌘" + face(m[1]), sub:"", kind:"mod"};
  if (BEHAVIOURS[code] || /MODE$|^DRAGSCROLL$|^DRAG_WINDOW$/.test(code)) return {main: face(code), sub:"", kind:"device"};

  return {x: GEO.rightX[c], y: GEO.rightTopY[c] + row * GEO.rowStep + GEO.yOffset, a: 0};

/* ── the board ─────────────────────────────────────────────────────────
   One component. It always paints the light the keyboard would actually show —
   base effect, then this layer's colour on the keys it maps, then a pointing
   mode's own colour — and draws the legend, the behaviour dots and the combo
   badges on top. Colour only ever comes from the device. The LED-index face is
   used solely by the LED group selector in Lighting. */
/* Colour edits are draft changes like any other: they show up in the count and
   in the review, and they are what the board is already drawing. */
function noteChange(area, label, before, after) {
  const existing = S.extra.find(c => c.label === label);
  if (existing) { existing.after = after; return; }

const changeCount = () => CHANGES.length + S.extra.length;

// plus the three right thumb keys, matching the LED numbering.
const RIGHT_THUMBS = [51, 52, 55];

  const right = index < 48 ? index % 12 >= 6 : RIGHT_THUMBS.includes(index);

  if (/left/i.test(locality)) return !right;

}

function board(opts) {
  const o = Object.assign({layer: 0, mode: "light", faces: false, selected: null, picks: [], onKey: null,

  codes.forEach((code, i) => {
    const v = keyVisual(i), f = keyFace(code);
    const cx = v.x + GEO.keyW / 2, cy = v.y + GEO.keyH / 2;
    const tr = v.a ? ` transform="rotate(${v.a} ${cx} ${cy})"` : "";
    const mapped = code !== _ && code !== X;
    let cls = "kc", fill = "", text = "";
    if (f.kind === "trns") cls += " kc-trns";
    if (f.kind === "none") cls += " kc-none";
    if (o.selected === i) cls += " sel";

    } else {

      // then this layer's colour on the keys it maps. A pointing mode's colour
      // is an overlay that only exists while that mode is active, and it paints
      // by locality rather than on the key that binds it, so it is not here.

      fill = ` style="fill:${css(led)};stroke:rgba(255,255,255,${f.kind === "trns" ? ".16" : ".3"})"`;

        `<span class="chip"><b>${x.op}</b> ${esc(x.name)}</span>`).join("")}</span>
      <span class="note">staged in your draft · nothing is on the keyboard until you apply</span>
      <span class="right" style="margin-left:auto"><button class="btn ghost" data-discardlayers>Discard staged layers</button></span></div>`);
    bar.querySelector("[data-discardlayers]").addEventListener("click", () => { S.layerStaged = []; render(); });
    wrap.appendChild(bar);
  }
  wrap.querySelectorAll("[data-layer]").forEach(b => b.addEventListener("click", () => { S.layer = Number(b.dataset.layer); render(); }));
  wrap.querySelector("[data-addlayer]")?.addEventListener("click", () => { S.layerAdd = !S.layerAdd; render(); });
  wrap.querySelector("[data-dellayer]")?.addEventListener("click", () => {
    S.layerStaged = [...S.layerStaged, {op: "delete", name: LAYERS[S.layer].name}]; render();
  });
  wrap.querySelector("[data-priority]")?.addEventListener("click", () => { S.screen = "profile"; render(); });
  return wrap;
}

/* ── screen: keys ─────────────────────────────────────────────────────────
   The board is the constant. Underneath it, one workbench whose tabs are the
   same tabs the layer overview had — except each tab now owns its editing
   surface at full width, instead of every editor sharing one narrow sidecar.
   A behaviour is a grid (tap count × tier), so it is drawn as one.          */
const TABS = [
  {id: "key", label: "Key"},
  {id: "behaviours", label: "Behaviours"},
  {id: "combos", label: "Combos"},
  {id: "macros", label: "Macros"},
  {id: "pointing", label: "Pointing modes"}
];

function layerFacts() {
  const codes = KEYMAPS[S.layer];
  return {
    codes,
    behaviours: [...new Set(codes.filter(c => BEHAVIOURS[c]))],
    macros: [...new Set(codes.filter(c => /^VIA_MACRO_/.test(c)))],
    pointing: [...new Set(codes.filter(c => PD_MODES.some(p => p.bind === c)))],
    combos: COMBOS
  };
}

function screenKeys() {
  const layer = LAYERS[S.layer];
  const facts = layerFacts();
  const counts = {key: "", behaviours: facts.behaviours.length, combos: facts.combos.length,
    macros: facts.macros.length, pointing: facts.pointing.length};
  const main = el(`<div class="main">
    ${topbar("Keys", "The keyboard stays on screen. Pick a key on it, then work in the tab you need — the key itself, its behaviour, the combos it belongs to, the macros and pointing modes this layer reaches.",
      `<button class="btn ghost" data-tip="Open the lighting stages that paint this board." data-golight2>Lighting…</button>
       <button class="btn ghost icon" data-tip="Find a key or keycode on this layer."><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg></button>`)}
  </div>`);
  main.appendChild(layerbar());

  const content = el(`<div class="content"><div class="pad keys-pad"></div></div>`);
  const pad = content.firstElementChild;

  const stage = el(`<div class="stack" style="gap:10px"></div>`);
  stage.appendChild(el(`<div class="stage-head">
      <h2>${layer.name}</h2>
      <span class="muted" style="font-size:12px">${layer.pass ? "lighting passes through to the layer underneath" : `lit HSV(${layer.hsv.join(", ")}) on keys mapped here`}</span>
      <span class="right"><button class="btn tiny ghost" data-tip="Copy every key on this layer to another layer.">Copy layer</button>
        <button class="btn tiny ghost">Rename</button></span></div>`));
  if (S.comboPicking) {
    const bar = el(`<div class="pickbar">
      <span><b>Picking combo inputs</b> — click keys on the board</span>
      <span class="n">${S.comboInputs.length ? S.comboInputs.map(i => keyFace(KEYMAPS[S.layer][i]).main).join(" + ") : "none yet"}</span>
      <span class="right" style="margin-left:auto;display:flex;gap:6px">
        <button class="btn tiny ghost" data-clearinputs>Clear</button>
        <button class="btn tiny" data-donepicking>Done</button></span></div>`);
    bar.querySelector("[data-clearinputs]").addEventListener("click", () => { S.comboInputs = []; render(); });
    bar.querySelector("[data-donepicking]").addEventListener("click", () => { S.comboPicking = false; render(); });
    stage.appendChild(bar);
  }
  stage.appendChild(board({
    layer: S.layer, mode: "light", faces: true, selected: S.selected,
    picking: S.comboPicking, inputs: S.comboPicking ? S.comboInputs : [],
    swap: true,
    onKey: i => {
      if (S.comboPicking) S.comboInputs = S.comboInputs.includes(i) ? S.comboInputs.filter(x => x !== i) : [...S.comboInputs, i];
      else {
        S.selected = i;
        const code = KEYMAPS[S.layer][i];
        if (S.tab === "behaviours" && BEHAVIOURS[code]) { S.behRow = code; S.cell = null; }
      }
      render();
    },
    onOpen: i => { S.selected = i; openPicker(`Keycode on ${LAYERS[S.layer].name}`, `index ${i}`, "single", [KEYMAPS[S.layer][i]].filter(c => c !== "_______" && c !== "XXXXXXX")); }
  }));
  stage.appendChild(el(`<div class="board-legend">
    <span class="legend-item">the board shows the light this layer actually paints</span>
    ${FEEDBACK_TIERS.map(t => `<span class="legend-item"><i class="ldot" style="${stageOn("key") && !isOff(tierHsv(t.kind)) ? `background:${css(tierHsv(t.kind))}` : "background:none;border-style:dashed"}"></i> ${t.label} branch</span>`).join("")}
    <span class="legend-item"><i class="lbadge">C1</i> combo input</span>
    <span class="legend-item"><span class="m" style="border-style:dashed"></span> transparent · falls through</span>
    <span class="legend-item dim">double-click to pick a keycode · drag one key onto another to swap · ⌘C and ⌘V copy between keys</span>
  </div>`));
  pad.appendChild(stage);

  const bench = el(`<div class="card bench">
    <div class="bench-tabs" role="tablist">
      ${TABS.map(t => `<button role="tab" data-tab="${t.id}" aria-selected="${S.tab === t.id}">
        ${t.label}${counts[t.id] !== "" ? ` <span class="c">${counts[t.id]}</span>` : `<span class="c mono">${S.selected}</span>`}</button>`).join("")}
      <span class="bench-right" id="benchRight"></span>
    </div>
    <div class="bench-body" id="benchBody"></div>
  </div>`);
  bench.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => { S.tab = b.dataset.tab; S.cell = null; render(); }));
  const body = bench.querySelector("#benchBody"), right = bench.querySelector("#benchRight");
  if (S.tab === "key") tabKey(body, right);
  if (S.tab === "behaviours") tabBehaviours(body, right, facts);
  if (S.tab === "combos") tabCombos(body, right);
  if (S.tab === "macros") tabMacros(body, right, facts);
  if (S.tab === "pointing") tabPointing(body, right, facts);
  pad.appendChild(bench);

  main.querySelector("[data-golight2]")?.addEventListener("click", () => { S.screen = "lighting"; render(); });
  main.appendChild(content);
  main.appendChild(commitBar());
  return main;
}

/* ── tab: the selected key ─────────────────────────────────────────────── */
function tabKey(body, right) {
  const code = KEYMAPS[S.layer][S.selected];
  const f = keyFace(code);
  const beh = BEHAVIOURS[code];
  const combos = COMBOS.filter(c => c.inputs.includes(code));
  const layer = LAYERS[S.layer];
  const pd = PD_MODES.find(p => p.bind === code);
  right.innerHTML = `<span class="note">index ${S.selected} · row ${Math.floor(S.selected / 12)} · col ${S.selected % 12} · LED ${LED_INDEX[S.selected] ?? "—"}</span>`;
  const node = el(`<div class="tab-grid three">
    <section>
      <div class="sect-h"><h4>This position on ${esc(layer.name)}</h4>
        <span class="right"><button class="btn tiny ghost" data-tip="Copy this key's stored value; paste onto another selected key.">Copy</button>
        <button class="btn tiny ghost" data-tip="Set this position to XXXXXXX so it does nothing on this layer.">Clear</button></span></div>
      <div class="field"><span>Keycode</span>
        <div class="input-row"><input class="input mono" value="${esc(code)}"
          data-tip="Key label or expression stored here, for example A, Enter, _______, LT(Navigation, /) or Cmd+C."><button class="btn" data-pickkey>Pick…</button></div></div>
      <dl class="kv" style="margin-top:12px">
        <dt>Resolves to</dt><dd>${esc(f.main || "—")}${f.sub ? " · " + esc(f.sub) : ""}</dd>
        <dt>Stored</dt><dd>${esc(code)}</dd>
        <dt>Matrix</dt><dd>row ${Math.floor(S.selected / 12)} · col ${S.selected % 12}</dd>
        <dt>LED index</dt><dd>${LED_INDEX[S.selected] ?? "—"}</dd>
      </dl>
    </section>
    <section>
      <div class="sect-h"><h4>This position across the stack</h4></div>
      <div class="stacklist">
        ${[...LAYERS].reverse().map(l => {
          const c = KEYMAPS[l.i][S.selected], face2 = keyFace(c);
          const through = c === "_______";
          return `<button class="stackrow ${l.i === S.layer ? "on" : ""}" data-golayer="${l.i}">
            <span class="swatch-lg ${isOff(l.hsv) ? "swatch-off" : ""}" style="width:12px;height:12px;border-radius:4px;${isOff(l.hsv) ? "" : `background:${css(l.hsv)}`}"></span>
            <span class="nm">${l.name}</span>
            <span class="val ${through ? "dim" : ""}">${through ? "falls through" : esc(face2.main || "nothing")}</span>
            <code class="dim">${through ? "_______" : esc(c)}</code></button>`;
        }).join("")}
      </div>
      <p class="note" style="margin-top:8px">Higher layers win. A transparent key lets the layer underneath answer.</p>
    </section>
    <section>
      <div class="sect-h"><h4>What this key reaches</h4></div>
      <div class="stack" style="gap:8px">
        <button class="reach ${beh ? "" : "empty"}" data-goto="behaviours">
          <span class="rl">Behaviour</span>
          <span class="rv">${beh ? `${tierDots(beh)} ${esc(beh.title)} · ${beh.branches.length} branches` : "none on this key"}</span>
          <span class="ra">${beh ? "Edit" : "Add"}</span></button>
        <button class="reach ${combos.length ? "" : "empty"}" data-goto="combos">
          <span class="rl">Combos</span>
          <span class="rv">${combos.length ? combos.map(c => c.id + " → " + face(c.out)).join(" · ") : "not part of a combo"}</span>
          <span class="ra">${combos.length ? "Edit" : "New"}</span></button>
        ${pd ? `<button class="reach" data-goto="pointing"><span class="rl">Pointing</span>
          <span class="rv"><span class="swatch-lg ${isOff(pd.hsv) ? "swatch-off" : ""}" style="width:11px;height:11px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:6px;${isOff(pd.hsv) ? "" : `background:${css(pd.hsv)}`}"></span>${esc(pd.name)} · lights the ${esc(pd.locality.toLowerCase())} while held</span><span class="ra">Edit</span></button>` : ""}
        <div class="reach static">
          <span class="rl">Light</span>
          <span class="rv row" style="gap:7px">
            <span class="swatch-lg ${isOff(layer.hsv) ? "swatch-off" : ""}" style="width:12px;height:12px;border-radius:4px;${isOff(layer.hsv) ? "" : `background:${css(layer.hsv)}`}"></span>
            ${layer.pass ? "passes through" : `HSV(${layer.hsv.join(", ")}) · ${layer.rule.replace(/_/g, " ").toLowerCase()}`}</span>
          <button class="ra" data-golight>Edit</button></div>
      </div>
    </section>
  </div>`);
  node.querySelector("[data-pickkey]").addEventListener("click", () =>
    openPicker(`Keycode on ${LAYERS[S.layer].name}`, `index ${S.selected}`, "single", [code].filter(c => c !== "_______" && c !== "XXXXXXX")));
  node.querySelectorAll("[data-golayer]").forEach(b => b.addEventListener("click", () => { S.layer = Number(b.dataset.golayer); render(); }));
  node.querySelectorAll("[data-goto]").forEach(b => b.addEventListener("click", () => {
    S.tab = b.dataset.goto;
    if (S.tab === "behaviours" && BEHAVIOURS[code]) S.behRow = code;
    if (S.tab === "combos" && !combos.length) { S.comboOpen = true; S.comboEdit = null; }
    render();
  }));
  node.querySelector("[data-golight]").addEventListener("click", () => { S.screen = "lighting"; S.stage = "layers"; render(); });
  body.replaceChildren(node);
}

/* ── tab: behaviours ───────────────────────────────────────────────────── */
function tabBehaviours(body, right, facts) {
  const selectedCode = KEYMAPS[S.layer][S.selected];
  const rows = facts.behaviours;
  if (!S.behRow || !BEHAVIOURS[S.behRow]) S.behRow = BEHAVIOURS[selectedCode] ? selectedCode : rows[0] || null;
  const beh = S.behRow ? BEHAVIOURS[S.behRow] : null;
  right.innerHTML = "";
  const addBtn = el(`<button class="btn tiny" data-tip="Give the selected key a behaviour: taps, holds, long holds and repeated-tap branches.">+ Behaviour on ${esc(keyFace(selectedCode).main || selectedCode)}</button>`);
  right.appendChild(addBtn);
  const node = el(`<div class="tab-split">
    <aside class="rowlist">
      <div class="rowlist-h">On this layer</div>
      ${rows.length ? rows.map(code => {
        const b = BEHAVIOURS[code], on = code === S.behRow;
        const where = KEYMAPS[S.layer].reduce((acc, c, i) => c === code ? [...acc, i] : acc, []);
        return `<button class="rowitem ${on ? "on" : ""}" data-row="${esc(code)}">
          <span class="t">${esc(b.title)}</span>
          <code class="dim">${esc(code)}</code>
          <span class="m">${tierDots(b)} ${b.branches.length} branches · ${where.length} key${where.length === 1 ? "" : "s"}</span></button>`;
      }).join("") : `<p class="note" style="padding:10px 12px">No key behaviour is placed on this layer.</p>`}
      <div class="rowlist-h" style="border-top:1px solid var(--line);border-bottom:0">Elsewhere</div>
      ${Object.keys(BEHAVIOURS).filter(c => !rows.includes(c)).map(code => `
        <button class="rowitem quiet ${code === S.behRow ? "on" : ""}" data-row="${esc(code)}">
          <span class="t">${esc(BEHAVIOURS[code].title)}</span><code class="dim">${esc(code)}</code>
          <span class="m">${tierDots(BEHAVIOURS[code])} not on this layer</span></button>`).join("")}
    </aside>
    <div class="beh-main">${beh ? behaviourEditor(beh) : `<p class="note" style="padding:16px">Select a behaviour row, or add one to the selected key.</p>`}</div>
  </div>`);
  node.querySelectorAll("[data-row]").forEach(b => b.addEventListener("click", () => { S.behRow = b.dataset.row; S.cell = null; render(); }));
  node.querySelectorAll("[data-cell]").forEach(b => b.addEventListener("click", () => {
    S.cell = S.cell === b.dataset.cell ? null : b.dataset.cell; render();
  }));
  node.querySelector("[data-closecell]")?.addEventListener("click", () => { S.cell = null; render(); });
  node.querySelector("[data-pickcell]")?.addEventListener("click", () => {
    const [n, tier] = S.cell.split("-");
    openPicker(`${tier === "tap" ? "Tap" : tier === "hold" ? "Hold" : "Long hold"} action`, `${beh.title} · ${n}× branch`, "single", []);
  });
  body.replaceChildren(node);
}

/* A behaviour is tap-count × tier. Drawing it as a grid makes the whole row
   readable at a glance: which branches exist, which tiers they fill. */
/* The same colours the board paints: a tier's dot and a branch's number wear
   the feedback colour the keyboard will flash, and go hollow when that stage is
   switched off. */
function tierDot(kind) {
  const hsv = tierHsv(kind);
  const lit = stageOn("key") && !isOff(hsv);
  return `<i class="fbdot" style="${lit ? `background:${css(hsv)}` : "background:none;border-style:dashed"}"></i>`;
}
function branchTint(n) {
  const row = FEEDBACK.find(f => f.k === `Tap count ${n}`);
  if (!row || !stageOn("key") || isOff(row.hsv)) return "";
  return `border-color:${css(row.hsv)};color:${css(row.hsv)}`;
}
function tierDots(b) {
  return FEEDBACK_TIERS.filter(t => b.branches.some(br => br[t.kind])).map(t => tierDot(t.kind)).join("");
}
function behaviourEditor(b) {
  const TIERS = [["tap", "Tap"], ["hold", "Hold"], ["long", "Long hold"]];
  const branches = b.branches;
  const cell = (br, tier) => {
    const v = br[tier], id = `${br.n}-${tier}`, on = S.cell === id;
    if (!v) return `<button class="bcell empty ${on ? "on" : ""}" data-cell="${id}"><span class="plus">+</span></button>`;
    return `<button class="bcell ${on ? "on" : ""}" data-cell="${id}">
      <span class="bk">${esc(v[0])}</span><span class="bl">${esc(v[1])}</span></button>`;
  };
  const editor = () => {
    if (!S.cell) return "";
    const [nRaw, tier] = S.cell.split("-");
    const n = Number(nRaw), br = branches.find(x => x.n === n), v = br?.[tier];
    const label = {tap: "Tap", hold: "Hold", long: "Long hold"}[tier];
    const HELPERS = ["held until release", "tap at hold threshold", "tap on release after hold", "repeat while held"];
    return `<div class="cell-editor">
      <div class="ce-head"><span class="tag">${n}× branch</span><h4>${label}</h4>
        <span class="note">${tier === "tap"
          ? "A tap tier fires on release, so it has no helper."
          : `Runs after the ${tier === "hold" ? "tap / hold" : "long hold"} threshold for this row.`}</span>
        <span class="right"><button class="btn tiny ghost" data-closecell>Done</button></span></div>
      <div class="ce-body">
        <label class="field"><span>Sends</span>
          <div class="input-row"><input class="input mono" value="${esc(v?.[0] || "")}" placeholder="nothing"><button class="btn" data-pickcell>Pick…</button></div></label>
        ${tier === "tap" ? "" : `<label class="field"><span>How it runs</span>
          <select class="input">${HELPERS.map(h => `<option ${v && h === v[1] ? "selected" : ""}>${h}</option>`).join("")}</select></label>`}
        ${v && v[1] === "repeat while held" ? `<label class="field"><span>Repeat rate</span><input class="input mono" value="100"
          data-tip="Only used by repeat while held. Higher values send the action more often."></label>` : `<span></span>`}
        <div class="row" style="gap:8px;align-items:end">
          ${v ? `<button class="btn ghost" data-tip="Leave this tier empty on this branch.">Remove tier</button>` : ""}
        </div>
      </div>
    </div>`;
  };
  return `<div class="beh-head">
      <div>
        <div class="row" style="gap:9px"><h3 style="font-size:15px">${esc(b.title)}</h3><code class="dim">${esc(b.key)}</code></div>
        <p class="note" style="margin-top:3px">Placed on ${KEYMAPS[S.layer].filter(c => c === b.key).length || "no"} key${KEYMAPS[S.layer].filter(c => c === b.key).length === 1 ? "" : "s"} on this layer. Timing left empty uses the keyboard default.</p>
      </div>
      <div class="right row" style="gap:8px;margin-left:auto">
        <button class="btn ghost" data-tip="Remove this behaviour from the draft. Its keys then send their plain keycode.">Remove behaviour</button>
      </div>
    </div>
    <div class="beh-timing">
      <label class="field"><span>Tap / hold</span><input class="input mono" value="${b.tapHold || ""}" placeholder="default 150"
        data-tip="Tap-versus-hold boundary for this row, 0–65535 ms. Empty uses the keyboard default, whose duration the firmware does not report."></label>
      <label class="field"><span>Long hold</span><input class="input mono" value="" placeholder="default 400"
        data-tip="Hold-versus-long-hold boundary for this row."></label>
      <label class="field"><span>Repeated taps</span><input class="input mono" value="${b.multiTap || ""}" placeholder="default 150"
        data-tip="How long the keyboard waits for another tap before resolving the branch."></label>
      <label class="sw" data-tip="Treat this row as a mouse gesture, so pressing it keeps the pointer layer up instead of letting auto-mouse reset."><input type="checkbox" ${b.anchor ? "checked" : ""}><span class="track"></span><span class="txt">Keeps auto-mouse anchored</span></label>
    </div>
    <div class="bgrid" style="grid-template-columns:86px repeat(${branches.length}, minmax(150px, 1fr)) 120px">
      <span></span>
      ${branches.map(br => `<div class="bhead"><span class="bn" style="${branchTint(br.n)}">${br.n}×</span>
        <span>${["Single","Double","Triple","Quadruple","Quintuple"][br.n - 1]} tap</span>
        <button class="bx" data-tip="Remove this tap branch.">✕</button></div>`).join("")}
      <div class="bhead add"><button class="btn tiny ghost">+ Add branch</button></div>
      ${TIERS.map(([tier, label]) => `
        <div class="btier">${tierDot(tier)}${label}</div>
        ${branches.map(br => cell(br, tier)).join("")}
        <span></span>`).join("")}
    </div>
    ${editor()}
    <p class="note" style="margin-top:12px">Every cell is one action: what it sends, and how it runs once its threshold passes. Empty cells are dropped when the profile is applied.</p>`;
}

/* ── tab: combos ───────────────────────────────────────────────────────── */
function tabCombos(body, right) {
  right.innerHTML = "";
  const add = el(`<button class="btn tiny" data-newcombo>${S.comboOpen ? "Close builder" : "New combo"}</button>`);
  add.addEventListener("click", () => { S.comboOpen = !S.comboOpen; S.comboEdit = null; if (!S.comboOpen) S.comboPicking = false; render(); });
  right.appendChild(add);
  const node = el(`<div class="tab-split wide">
    <div>
      <div class="row" style="gap:16px;padding:0 0 12px">
        <label class="field" style="width:170px"><span>Hold threshold · all combos</span><input class="input mono" value="200 ms"
          data-tip="Shared by every combo, exactly as QMK does it."></label>
        <label class="sw" style="margin-top:16px"><input type="checkbox" checked><span class="track"></span><span class="txt">Combos enabled on the keyboard</span></label>
        <span class="note" style="margin:18px 0 0 auto">${COMBOS.length} combos read from the keyboard</span>
      </div>
      <table class="t"><thead><tr><th>Combo</th><th>Inputs</th><th>Sends</th><th>Window</th><th>Requires</th><th>On this layer</th><th></th></tr></thead>
        <tbody>${COMBOS.map(c => {
          const here = c.inputs.every(i => KEYMAPS[S.layer].includes(i) || S.layer === 0);
          const outBeh = BEHAVIOURS[c.out];
          return `<tr><td class="mono">${c.id}</td>
            <td>${c.inputs.map(i => `<span class="tok">${esc(face(i))}</span>`).join(" + ")}</td>
            <td><span class="mono">${esc(c.out)}</span>${outBeh ? `<div><button class="btn tiny ghost" data-outbeh="${esc(c.out)}" data-tip="Open this combo's output in the behaviour editor.">has a behaviour →</button></div>` : ""}</td>
            <td class="mono">${c.win} ms</td><td class="muted">${c.req}</td>
            <td class="${here ? "" : "dim"}">${here ? "reachable" : "inputs not on this layer"}</td>
            <td style="text-align:right"><button class="btn tiny ghost" data-editcombo="${c.id}">Edit</button></td></tr>`;
        }).join("")}</tbody></table>
      <p class="note" style="margin-top:12px">Combo inputs are matched through each layer's reference layer, set in Settings → Combo layer matching. Firmware trigger and release hooks are flagged, not reconstructed.</p>
    </div>
    <div>${S.comboOpen ? comboBuilder() : `<div class="empty-card">
      <p class="note">Pick <b>New combo</b> to build one: choose what it sends, then click its input keys straight on the board.</p></div>`}</div>
  </div>`);
  node.querySelectorAll("[data-editcombo]").forEach(b => b.addEventListener("click", () => {
    const combo = COMBOS.find(c => c.id === b.dataset.editcombo);
    S.comboEdit = combo.id; S.comboOpen = true; S.comboOutput = combo.out;
    S.comboInputs = combo.inputs.map(i => KEYMAPS[S.layer].indexOf(i)).filter(i => i >= 0);
    render();
  }));
  node.querySelectorAll("[data-outbeh]").forEach(b => b.addEventListener("click", () => { S.tab = "behaviours"; S.behRow = b.dataset.outbeh; render(); }));
  node.querySelector("[data-pickout]")?.addEventListener("click", () => openPicker("Combo output", S.comboEdit || "new combo", "single", [S.comboOutput]));
  node.querySelector("[data-pickinputs]")?.addEventListener("click", () =>
    openPicker("Combo inputs", S.comboEdit || "new combo", "list", S.comboInputs.map(i => KEYMAPS[S.layer][i])));
  node.querySelector("[data-pickboard]")?.addEventListener("click", () => { S.comboPicking = !S.comboPicking; render(); });
  node.querySelectorAll("[data-rminput]").forEach(b => b.addEventListener("click", () => {
    S.comboInputs = S.comboInputs.filter(i => i !== Number(b.dataset.rminput)); render();
  }));
  node.querySelector("[data-cancelcombo]")?.addEventListener("click", () => { S.comboOpen = false; S.comboPicking = false; S.comboEdit = null; render(); });
  node.querySelector("[data-keepcombo]")?.addEventListener("click", () => { S.comboOpen = false; S.comboPicking = false; S.comboEdit = null; render(); });
  body.replaceChildren(node);
}

/* ── screen: lighting ────────────────────────────────────────────────── */
const STAGES = [
  {id:"base",   name:"Base effect",    on:true,  note:"Solid colour · hue 140 · 71% brightness"},
  {id:"layers", name:"Layer colours",  on:true,  note:"5 of 8 layers light up"},
  {id:"auto",   name:"Auto-mouse fade",on:true,  note:"follows the real destination"},
  {id:"pd",     name:"Pointing modes", on:true,  note:"6 modes · right half"},
  {id:"combo",  name:"Combo feedback", on:false, note:"off"},
  {id:"key",    name:"Key feedback",   on:true,  note:"7 semantics · 10 ms flash"}
];
/* ── screen: lighting ─────────────────────────────────────────────────────
   Same shape as Keys: the board is the constant, and the stages are tabs whose
   bodies are the editing surface at full width. The paint order lives under the
   board, because that is where you read the result of it.                    */
const ROW_DRAFT = {hsv: [196, 255, 200]};
const LIGHT_TABS = [
  {id: "base", label: "Base effect"},
  {id: "layers", label: "Layer colours"},
  {id: "auto", label: "Auto-mouse fade"},
  {id: "pd", label: "Pointing modes"},
  {id: "combo", label: "Combo feedback"},
  {id: "key", label: "Key feedback"},
  {id: "groups", label: "LED groups"}
];

function screenLighting() {
  const onGroups = S.stage === "groups";
  const stage = STAGES.find(x => x.id === S.stage);
  const main = el(`<div class="main">
    ${topbar("Lighting", "The only colour in this app is colour the keyboard emits. Stages paint in order, and the board below is the result — the draft's result, before anything is applied.",
      `<button class="btn ghost" data-tip="Read the keyboard's lighting again, keeping your draft.">Read lighting</button>`)}
  </div>`);
  main.appendChild(layerbar(true));

  const content = el(`<div class="content"><div class="pad keys-pad"></div></div>`);
  const pad = content.firstElementChild;
  const stageWrap = el(`<div class="stack" style="gap:10px"></div>`);
  stageWrap.appendChild(el(`<div class="stage-head">
    <h2>${onGroups ? "LED selector" : "Preview"}</h2>
    <span class="muted" style="font-size:12px">${onGroups
      ? `click physical LEDs to build a group · ${S.ledPicks.length} selected${S.trackball ? " + trackball" : ""}`
      : `${LAYERS[S.layer].name} over the base effect${S.stage === "pd" && S.pdPreview ? ` · ${esc(PD_MODES[S.pd].name || "empty slot")} held, painting the ${PD_MODES[S.pd].locality.toLowerCase()}` : ""}`}</span>
    <span class="right row" style="gap:6px">${onGroups
      ? `<button class="btn tiny ghost" data-clearleds>Clear selection</button>
         <button class="btn tiny ${S.trackball ? "primary" : "ghost"}" data-trackball data-tip="Add or remove the trackball LED, index 56, from this selection.">Trackball LED</button>`
      : ""}</span></div>`));
  stageWrap.appendChild(board({
    layer: S.layer,
    mode: onGroups ? "leds" : "light",
    picks: S.ledPicks,
    pdActive: S.stage === "pd" && S.pdPreview && stageOn("pd") ? PD_MODES[S.pd] : null,
    onKey: onGroups ? (i => { S.ledPicks = S.ledPicks.includes(i) ? S.ledPicks.filter(x => x !== i) : [...S.ledPicks, i]; render(); }) : null
  }));
  stageWrap.appendChild(paintOrder());
  stageWrap.querySelector("[data-clearleds]")?.addEventListener("click", () => { S.ledPicks = []; render(); });
  stageWrap.querySelector("[data-trackball]")?.addEventListener("click", () => { S.trackball = !S.trackball; render(); });
  pad.appendChild(stageWrap);

  const bench = el(`<div class="card bench">
    <div class="bench-tabs" role="tablist">
      ${LIGHT_TABS.map(t => {
        const st = STAGES.find(x => x.id === t.id);
        return `<button role="tab" data-ltab="${t.id}" aria-selected="${S.stage === t.id}">
          ${st ? `<i class="stagedot ${st.on ? "on" : ""}"></i>` : ""}${t.label}</button>`;
      }).join("")}
      <span class="bench-right" id="benchRight"></span>
    </div>
    <div class="bench-body" id="benchBody"></div>
  </div>`);
  bench.querySelectorAll("[data-ltab]").forEach(b => b.addEventListener("click", () => { S.stage = b.dataset.ltab; render(); }));
  const right = bench.querySelector("#benchRight");
  if (stage) {
    const sw = el(`<label class="sw" data-tip="Turn this whole stage off without losing the colours it stores."><input type="checkbox" ${stage.on ? "checked" : ""}><span class="track"></span><span class="txt">${stage.on ? "Stage on" : "Stage off"}</span></label>`);
    sw.querySelector("input").addEventListener("change", (event) => {
      stage.on = event.target.checked;
      noteChange("Lighting", `${stage.name} stage`, stage.on ? "off" : "on", stage.on ? "on" : "off");
      render();
    });
    right.appendChild(sw);
  }
  lightTab(bench.querySelector("#benchBody"), right);
  pad.appendChild(bench);

  main.appendChild(content);
  main.appendChild(commitBar());
  return main;
}

/* The order the stages paint in, as a row under the board: it explains what you
   are looking at, and doubles as a way into each stage. */
function paintOrder() {
  const row = el(`<div class="paintorder"></div>`);
  row.appendChild(el(`<span class="note">painted in order</span>`));
  STAGES.forEach((st, i) => {
    const swatch = {
      base: () => BASE_EFFECT.hsv, layers: () => LAYERS[S.layer].hsv, pd: () => PD_MODES[S.pd].hsv,
      combo: () => COMBO_FEEDBACK.hsv, key: () => tierHsv("hold"), auto: () => [0, 0, 0]
    }[st.id]();
    const item = el(`<button class="pochip ${S.stage === st.id ? "on" : ""} ${st.on ? "" : "off"}" data-po="${st.id}">
      <span class="n">${i + 1}</span>
      <span class="swatch-lg ${isOff(swatch) || !st.on ? "swatch-off" : ""}" style="width:11px;height:11px;border-radius:3px;${isOff(swatch) || !st.on ? "" : `background:${css(swatch)}`}"></span>
      <span>${st.name}</span>${st.on ? "" : `<span class="note">off</span>`}</button>`);
    item.addEventListener("click", () => { S.stage = st.id; render(); });
    row.appendChild(item);
  });
  row.appendChild(el(`<span class="note" style="margin-left:auto">animations, idle fade and momentary feedback are not simulated</span>`));
  return row;
}

function colourEditor(target, title, area) {
  const hsv = target.hsv;
  const node = el(`<div class="stack" style="gap:12px"></div>`);
  const commit = (next, what) => {
    const before = `HSV(${target.hsv.join(", ")})`;
    target.hsv = next.map(v => Math.max(0, Math.min(255, Math.round(v))));
    noteChange(area || "Lighting", `${title} · ${what}`, before, `HSV(${target.hsv.join(", ")})`);
    render();
  };
  if (isOff(hsv)) {
    node.append(el(`<div class="row" style="gap:10px"><span class="swatch-lg swatch-off" style="width:34px;height:34px"></span>
      <div><div style="font-size:12.5px">${esc(title)}</div><div class="note mono">HSV(0, 0, 0)</div></div></div>`));
    node.append(el(`<div class="callout">No colour is stored, so this stage leaves whatever is underneath visible. Pick a colour to start lighting it.</div>`));
    const give = el(`<button class="btn" style="justify-self:start">Give it a colour</button>`);
    give.addEventListener("click", () => commit([140, 255, 200], "colour"));
    node.append(give);
    return node;
  }
  node.append(el(`<div class="row" style="gap:10px"><span class="swatch-lg" style="width:34px;height:34px;background:${css(hsv)}"></span>
    <div><div style="font-size:12.5px">${esc(title)}</div><div class="note mono">HSV(${hsv.join(", ")}) · ${css(hsv)}</div></div>
    <button class="btn tiny ghost" style="margin-left:auto" data-off data-tip="Store HSV(0, 0, 0) so this stage stops painting and lets what is underneath show.">Turn off</button></div>`));
  const field = el(`<div class="sv-field" style="background:linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, ${qmkRgb(hsv[0], 255, 255)})">
    <span class="thumb" style="left:${(hsv[1] / 255) * 100}%;top:${100 - (hsv[2] / 255) * 100}%"></span></div>`);
  field.addEventListener("pointerdown", (event) => {
    const r = field.getBoundingClientRect();
    commit([hsv[0], ((event.clientX - r.left) / r.width) * 255, (1 - (event.clientY - r.top) / r.height) * 255], "saturation and brightness");
  });
  node.append(field);
  const ramp = el(`<div class="swatch-pick"><span class="label" style="width:34px">Hue</span>
    <span class="hue-ramp"><span class="thumb" style="left:${(hsv[0] / 255) * 100}%"></span></span></div>`);
  ramp.querySelector(".hue-ramp").addEventListener("pointerdown", (event) => {
    const r = event.currentTarget.getBoundingClientRect();
    commit([((event.clientX - r.left) / r.width) * 255, hsv[1], hsv[2]], "hue");
  });
  node.append(ramp);
  const fields = el(`<div class="grid3">
    ${[["H", hsv[0]], ["S", hsv[1]], ["V", hsv[2]]].map(([l, v], i) =>
      `<label class="field"><span>${l}</span><input class="input mono" value="${v}" data-ch="${i}"></label>`).join("")}</div>`);
  fields.querySelectorAll("[data-ch]").forEach(input => input.addEventListener("change", () => {
    const next = [...hsv]; next[Number(input.dataset.ch)] = Number(input.value) || 0;
    commit(next, ["hue", "saturation", "brightness"][Number(input.dataset.ch)]);
  }));
  node.append(fields);
  node.querySelector("[data-off]").addEventListener("click", () => commit([0, 0, 0], "turned off"));
  return node;
}

      </tbody></table></div>`));
    node.append(builder, tables);
  }

  body.replaceChildren(node);
}

function screenMacros() {
  const filled = new Map(MACROS.map(m => [m.n, m]));
  const sel = filled.get(S.macro) || {n: S.macro, bytes: 0, payload: "", steps: []};
  const dirty = S.macro === 2;
  const user = S.bank === "user";
  const slots = Array.from({length: user ? 16 : 32}, (_, i) => {
    const m = user ? null : filled.get(i);
    const peek = m ? (m.steps.find(st => st[0] === "text")?.[1] || m.steps[0][1]) : "";
    return `<button class="mslot ${m ? "filled" : ""}" data-macro="${i}" aria-current="${!user && S.macro === i}"
      data-tip="${m ? `VIA macro ${i} · ${m.bytes} bytes · ${m.steps.length} steps` : `${user ? "User" : "VIA"} macro ${i} · empty slot`}">
      <span class="n">${user ? "U" : "M"}${i}</span><span class="v">${m ? esc(peek.length > 9 ? peek.slice(0, 8) + "…" : peek) : "—"}</span></button>`;
  }).join("");
  const main = el(`<div class="main">
    ${topbar("Macros", "80 slots on the keyboard: 64 VIA slots and 16 user slots. Slots have no name on the keyboard, so they are identified by their number and their payload.",

        <div class="card-b"><div class="macro-grid">${slots}</div>
          <p class="note" style="margin-top:12px">${user ? "The user bank lives in the settings domain; all 16 slots are shown." : "Showing the VIA bank, 1–32 of 64."} Empty slots stay visible so you can see what the keyboard has room for.</p></div></div>

    </div></div></div>`);
  main.querySelectorAll("[data-macro]").forEach(b => b.addEventListener("click", () => { S.macro = Number(b.dataset.macro); render(); }));
  main.querySelectorAll("[data-bank] button").forEach(b => b.addEventListener("click", () => { S.bank = b.dataset.b; render(); }));
  const ed = main.querySelector("#macroEditor");
  ed.appendChild(el(`<div class="card">
    <div class="card-h"><h3>${user ? "User" : "VIA"} macro ${sel.n}</h3><code class="dim">${user ? "MACRO" : "VIA_MACRO"}_${sel.n}</code>
      <span class="right"><span class="chip"><i class="dot ${dirty ? "draft" : "on"}"></i>${dirty ? "edited" : "saved"}</span>
      <button class="btn tiny ghost" data-tip="Find the keys this macro is placed on, or place it on one.">Placed on 1 key</button></span></div>
    <div class="card-b stack">
      <label class="field"><span>Payload</span>
        <textarea class="input mono" rows="3" style="height:auto;padding:9px 10px;resize:vertical"
          data-tip="The macro exactly as the keyboard stores it. Text is literal; {KC_A} taps, {+KC_A} presses, {-KC_A} releases, {120} waits. Use {{ and }} for literal braces.">${esc(sel.payload)}</textarea></label>
      <div class="card" style="background:var(--surface-2)">
        <div class="card-h" style="padding:10px 12px"><h3>Add a step</h3><span class="right note">inserted at the cursor</span></div>

/* ── overlays ────────────────────────────────────────────────────────── */
// A colour written as HSV in the review gets its swatch, so a diff of light
// reads as light rather than as three numbers.
function swatchFor(text) {
  const m = /HSV\((\d+),\s*(\d+),\s*(\d+)\)/.exec(String(text));
  if (!m) return "";
  const hsv = [Number(m[1]), Number(m[2]), Number(m[3])];
  return `<span class="swatch-lg ${isOff(hsv) ? "swatch-off" : ""}" style="width:11px;height:11px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:6px;${isOff(hsv) ? "" : `background:${css(hsv)}`}"></span>`;
}
function overlayReview() {
  const CH = allChanges();
  const areas = [...new Set(CH.map(c => c.area))];
  const groups = areas.map(a => `
    <div style="padding:14px 18px 4px"><div class="sect-h"><h4>${a}</h4><span class="right tag">${CH.filter(c => c.area === a).length}</span></div>
      <table class="t"><thead><tr><th style="width:38%">What changes</th><th style="width:31%">On the keyboard</th><th style="width:31%">In your draft</th></tr></thead>
        <tbody>${CH.filter(c => c.area === a).map(c => `<tr>
          <td>${c.label}</td>
          <td class="mono del">${swatchFor(c.before)}${esc(c.before)}</td>
          <td class="mono ins">${swatchFor(c.after)}${esc(c.after)}</td></tr>`).join("")}</tbody></table></div>`).join("");
  const node = el(`<div class="scrim"><div class="sheet">
    <div class="sheet-h"><h2>Review ${CH.length} changes</h2>
      <span class="chip"><i class="dot draft"></i>draft since 13:48</span>

    <div class="sheet-b">${groups}
      <div style="padding:14px 18px 18px"><div class="callout warn">Apply writes a recovery copy, stages the changed blocks on both halves, then publishes one generation. The keyboard keeps running its saved profile until both halves confirm. If it is interrupted, the recovery copy restores it.</div></div>
    </div>
    <div class="sheet-f"><span class="note">Charybdis 4×6 · generation 42 → 43</span>
      <span class="right"><button class="btn" data-close>Cancel</button><button class="btn primary" data-close>Apply to keyboard</button></span></div>

  node.addEventListener("click", e => { if (e.target === node || e.target.closest("[data-close]")) { S.overlay = null; render(); } });

}
function pickerExpression() {
  const key = PICK.keys[0];
  if (!key) return "";
  if (PICK.mode === "list") return PICK.keys.join(", ");
  let out = key;
  for (const mod of PICK.mods) {
    const wrap = PICKER_MODS.find(m => m[0] === mod)[1];
    out = `${wrap}(${out})`;
  }
  if (PICK.ltLayer !== null) out = `LT(${LAYERS[PICK.ltLayer].name}, ${out})`;
  return out;
}
function pickerKeyLabel(code) {
  const f = keyFace(code);
  return f.main || code.replace(/^KC_/, "");
}
function pickerBoard() {
  const scale = 1;
  const keys = PICKER_BOARD.keys.map(([x, y, w, h, value, label]) => {
    const labels = Array.isArray(label) ? label : [label];
    const on = PICK.keys.includes(value);
    const shift = labels[1] && labels[1].length <= 3;
    return `<g class="pkb-key ${on ? "on" : ""}" data-pick="${value}" tabindex="0" role="button" aria-label="${esc(value)}">
      <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8"></rect>
      ${shift ? `<text class="pkb-alt" x="${x + w / 2}" y="${y + h * 0.36}">${esc(labels[1])}</text>
                 <text class="pkb-main" x="${x + w / 2}" y="${y + h * 0.74}">${esc(labels[0])}</text>`
              : `<text class="pkb-main ${labels[0].length > 4 ? "sm" : ""}" x="${x + w / 2}" y="${y + h / 2 + 5}">${esc(labels[0])}</text>`}
    </g>`;
  }).join("");
  return `<div class="pkb"><svg viewBox="0 0 ${PICKER_BOARD.w * scale} ${PICKER_BOARD.h * scale}" xmlns="http://www.w3.org/2000/svg">${keys}</svg></div>`;
}
function pickerGrid(rows) {
  return `<div class="pk-rows">${rows.map(row => `<div class="pk-row">${row.map(code => {
    const on = PICK.keys.includes(code);

}

    const rows = []; for (let i = 0; i < all.length; i += 8) rows.push(all.slice(i, i + 8));
    return `<div class="pk-body"><p class="note" style="margin-bottom:10px">${all.length} matches across every section</p>${pickerGrid(rows.slice(0, 8))}</div>`;
  }
  if (section.kind === "board") return `<div class="pk-body">${pickerBoard()}
    <p class="note" style="margin-top:12px">Click a key. Modifiers above wrap it, so <code>Cmd</code> + <code>C</code> stores <code>G(KC_C)</code> — identical to <code>LGUI(KC_C)</code>.</p></div>`;

      <button class="pk wide ${PICK.ltLayer === l.i ? "on" : ""}" data-lt="${l.i}"><span class="l">Tap-hold</span><span class="c">LT(${l.i}, …)</span></button>
    </div>`).join("")}</div>
    <p class="note" style="margin-top:12px">${PICK.ltLayer !== null

      <button class="pk wide ${PICK.keys[0] === p.bind + "_LOCK" ? "on" : ""}" data-pick="${esc(p.bind)}_LOCK" ${p.kind ? "" : "disabled"}><span class="l">Toggle</span><span class="c">${esc(p.bind)}_LOCK</span></button>

  if (section.kind === "macros") {
