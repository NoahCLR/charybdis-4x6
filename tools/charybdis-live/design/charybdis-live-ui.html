    const lt = e.target.closest("[data-lt]");
    if (lt) { PICK.ltLayer = PICK.ltLayer === Number(lt.dataset.lt) ? null : Number(lt.dataset.lt); render(); return; }
    if (e.target.closest("[data-clearlt]")) { PICK.ltLayer = null; render(); return; }
    if (e.target.closest("[data-clear]")) { PICK.keys = []; PICK.mods = []; PICK.ltLayer = null; render(); return; }
    const rm = e.target.closest("[data-remove]");
    if (rm) { PICK.keys.splice(Number(rm.dataset.remove), 1); render(); return; }
    const pick = e.target.closest("[data-pick]");
    if (pick && !pick.disabled) {
      const value = pick.dataset.pick;
      if (PICK.mode === "list") PICK.keys = PICK.keys.includes(value) ? PICK.keys.filter(k => k !== value) : [...PICK.keys, value];
      else PICK.keys = [value];
      render();
    }
  });
  const search = node.querySelector("#pkSearch");
  search.addEventListener("input", () => { PICK.search = search.value; render();
    const again = document.querySelector("#pkSearch"); if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); } });
  return node;
}
function openPicker(field, target, mode = "single", seed = []) {
  PICK.field = field; PICK.target = target; PICK.mode = mode; PICK.keys = seed; PICK.mods = []; PICK.ltLayer = null; PICK.search = "";
  PICK.section = mode === "list" ? "qwerty" : PICK.section;
  S.overlay = "picker"; render();
}
function overlayImport() {
  const rows = [["Layers", 8, 8], ["Key behaviours", 37, 41], ["Combos", 3, 5], ["Macros with content", 9, 12],
    ["Pointing modes", "6 of 8", "7 of 8"], ["Lighting stages", 6, 6], ["Settings", 28, 28]];
  const node = el(`<div class="scrim"><div class="sheet" style="width:min(720px,100%)">
    <div class="sheet-h"><h2>Restore this profile?</h2>
      <span class="right" style="margin-left:auto"><button class="btn ghost" data-close>Cancel</button></span></div>
    <div class="sheet-b" style="padding:18px">
      <p class="note" style="margin-bottom:14px"><code>charybdis-2026-09-12.json</code> · exported from a Charybdis 4×6 · action ABI 0x61072732 · matches this keyboard.</p>
      <table class="t"><thead><tr><th>Contents</th><th>On the keyboard</th><th>In this file</th></tr></thead>
        <tbody>${rows.map(([k, a, b]) => `<tr><td>${k}</td>
          <td class="mono ${String(a) === String(b) ? "muted" : "del"}">${a}</td>
          <td class="mono ${String(a) === String(b) ? "muted" : "ins"}">${b}</td></tr>`).join("")}</tbody></table>
      <div class="callout warn" style="margin-top:16px">This replaces the keyboard's layout, behaviours, combos, macros, lighting and settings. A recovery copy is saved automatically before restoring, and both halves are verified afterwards.</div>
    </div>
    <div class="sheet-f"><span class="note">Your local draft is kept separately — restoring does not touch it.</span>
      <span class="right"><button class="btn" data-close>Cancel</button>
        <button class="btn primary" data-close>Restore profile</button></span></div>
  </div></div>`);
  node.addEventListener("click", e => { if (e.target === node || e.target.closest("[data-close]")) { S.overlay = null; render(); } });
  return node;
}

function overlayNotes() {
  const swatches = [["--bg","var(--bg)"],["--surface","var(--surface)"],["--surface-3","var(--surface-3)"],["--key","var(--key)"],
    ["--text","var(--text)"],["--text-2","var(--text-2)"],["--text-3","var(--text-3)"],["--draft","var(--draft)"]];
  const node = el(`<div class="scrim"><div class="sheet" style="width:min(960px,100%)">
    <div class="sheet-h"><h2>Design notes</h2><span class="right" style="margin-left:auto"><button class="btn ghost" data-close>Close</button></span></div>
    <div class="sheet-b" style="padding:18px">
      <div class="stack" style="gap:18px">
        <div>
          <h3 style="margin-bottom:8px">The one rule</h3>
          <p class="note" style="font-size:12.5px;max-width:76ch">The interface is black and white. Every hue on screen is a colour the keyboard actually emits: a layer colour, a pointing-mode colour, a feedback colour, the base effect. Nothing decorative is coloured, so a colour on screen always means light on the keyboard. The single exception is one amber signal for unapplied work, because “your draft differs from the keyboard” is the one state that must never be missed.</p>
        </div>
        <div class="tokens">${swatches.map(([n, v]) => `<div class="token"><span class="sw" style="background:${v};border-bottom:1px solid var(--line)"></span><span class="m">${n}</span></div>`).join("")}</div>
        <div class="grid2">
          <div><h3 style="margin-bottom:8px">What changed</h3>
            <ul class="note" style="font-size:12.5px;padding-left:16px;display:grid;gap:6px;max-width:62ch">
              <li><b>One draft, one gate.</b> Every “keep in draft” button is gone; edits stage as you make them, undo and redo sit in the rail, and the floating bar is the only way changes reach the keyboard. Forms that are only half-finished — the combo builder, a new layer, a macro step — still keep their own state until you keep them.</li>
              <li><b>One board, always lit.</b> The keyboard's light is not a separate view to switch to: the board paints the base effect and this layer's colour, and draws the legends on top in whichever of black or white stays readable. Behaviour dots and combo badges ride on the key face, in the feedback colours the keyboard flashes.</li>
              <li><b>Every colour comes from one model, and the draft is what you see.</b> Layer colours, pointing-mode colours, the base effect and the seven feedback semantics live in one place; the Lighting editors write to it and the board, the key dots, the branch numbers, the hover card, the swatches in Settings and the swatches in the review all read from it. Change Hold active to magenta and every hold dot in the app is magenta before you apply anything.</li>
              <li><b>A stage that is off looks off.</b> Switch off key feedback and the dots go hollow — the branch still exists, the light does not. Switch off combo feedback and the badges lose their tint. Switch off the base effect and the unlit keys go black.</li>
              <li><b>A pointing-mode colour is an overlay, not a key colour.</b> It paints its locality — a half, both halves, or the trigger key — only while the mode is held or toggled, so it is never drawn on the key that binds it. Preview active in the Lighting stage shows exactly where it lands.</li>
              <li><b>The overview tabs became the editing surface.</b> The board stays on screen; underneath it one workbench switches between the key, its behaviour, combos, macros and pointing modes — each at full width. No editor is squeezed into a sidecar any more.</li>
              <li><b>Lighting has the same shape.</b> The layer chips pick what the board shows, the board is the result, the paint order sits under it as six numbered chips, and the six stages plus LED groups are the workbench tabs. Each stage owns a full-width surface: its list, its colour, where it paints, and what it does — with the stage's on/off switch in the tab bar.</li>
              <li><b>A behaviour is drawn as what it is.</b> Tap count × tier is a grid, so the whole row is legible at a glance: branches across, tap / hold / long hold down, every filled cell visible at once. Clicking a cell opens one editor under the grid instead of unfolding five nested forms.</li>
              <li><b>Depth on demand.</b> Pointing modes lead with name, movement, speed and actions; thresholds, ratios and button overrides live under Advanced.</li>
              <li><b>Health is ambient.</b> Four pills become three lines in the rail, always visible, never in the way.</li>
            </ul></div>
          <div><h3 style="margin-bottom:8px">Kept from the old app</h3>
            <ul class="note" style="font-size:12.5px;padding-left:16px;display:grid;gap:6px;max-width:62ch">
              <li><b>The key hover card.</b> Hovering a key still shows everything it reaches: behaviour branches with their lifecycles, macro payload steps, combos, pointing mode, and its light.</li>
              <li><b>The keycode picker.</b> A real ANSI keyboard, modifier wrappers, the layer section with hold / lock / tap-hold, pointing modes, both macro banks, every QMK section and search, with the live expression and OK / Cancel.</li>
              <li><b>The combo builder beside the board.</b> Inputs are picked on the physical keyboard, with window, hold and order requirements, and the shared hold threshold shown as shared.</li>
              <li><b>The LED group builder.</b> Physical LED indices on the board, the trackball LED, inline or reusable groups, and what each group is used by.</li>
              <li><b>Tooltips that say what a control writes</b>, layer staging, the recorder and payload preview, read-only settings for firmware that cannot report them.</li>
            </ul></div>
        </div>
        <div class="callout">Type: system sans for the interface, monospace for anything the keyboard stores — keycodes, HSV triples, digests, byte counts, LED indices. If it came off the device as a value, it is set in mono.</div>
        <div>
          <h3 style="margin-bottom:8px">States worth looking at</h3>
          <p class="note" style="font-size:12.5px">Open them directly: <code>#keys?tab=behaviours&amp;row=LEFT_THUMB&amp;cell=2-hold</code> the behaviour grid with one cell open · <code>#keys?tab=combos&amp;combo=picking</code> picking combo inputs on the board · <code>#keys?hover=50</code> hover card · <code>#lighting?lm=groups</code> LED group builder · <code>#lighting?stage=key</code> a stage's own surface · <code>#lighting?stage=groups</code> the board becomes the LED selector · <code>#lighting?stage=pd&amp;pdpreview=1&amp;layer=4</code> a mode's overlay previewed on its locality · <code>#keys?stageoff=key</code> feedback stage off, dots hollow · <code>#keys?comboon=1</code> combo feedback tinting the badges · <code>#keys?state=stale</code> the keyboard changed under the draft · <code>#keys?state=applying</code> mid-apply · <code>#keys?notice=error</code> an interrupted apply · <code>#import</code> restoring a profile file · <code>#review</code> · <code>#picker</code> · <code>#keys?theme=light</code>.</p>
        </div>
      </div>
    </div>
  </div></div>`);
  node.addEventListener("click", e => { if (e.target === node || e.target.closest("[data-close]")) { S.overlay = null; render(); } });
  return node;
}

/* ── hover layer ─────────────────────────────────────────────────────────
   The board's hover card, kept from the old app: everything a key reaches —
   behaviour branches with their lifecycles, macro payload, combos, its light —
   without clicking and without leaving the layer you are reading. */
const tipNode = el(`<div class="tip" hidden></div>`);
const cardNode = el(`<div class="hovercard" hidden></div>`);
document.body.append(tipNode, cardNode);
let tipTimer = 0;

function place(node, rect, gap = 10, beside = false) {
  node.hidden = false;
  const box = node.getBoundingClientRect();
  let left, top;
  if (beside) {
    // Sit next to the key rather than over the board or the header.
    const right = rect.right + gap, fits = right + box.width < innerWidth - 10;
    left = fits ? right : rect.left - gap - box.width;
    top = rect.top + rect.height / 2 - box.height / 2;
  } else {
    left = rect.left + rect.width / 2 - box.width / 2;
    top = rect.top - box.height - gap;
    if (top < 10) top = rect.bottom + gap;
  }
  node.style.left = `${Math.max(10, Math.min(left, innerWidth - box.width - 10))}px`;
  node.style.top = `${Math.max(10, Math.min(top, innerHeight - box.height - 10))}px`;
}
function hideHover() { clearTimeout(tipTimer); tipNode.hidden = true; cardNode.hidden = true; }

function keyCardHtml(index) {
  const code = KEYMAPS[S.layer][index];
  const f = keyFace(code);
  const beh = BEHAVIOURS[code];
  const combos = COMBOS.filter(c => c.inputs.includes(code));
  const macro = /^VIA_MACRO_(\d+)$/.exec(code);
  const layer = LAYERS[S.layer];
  const pd = PD_MODES.find(p => p.bind === code);
  const sections = [];
  const lit = stageOn("key");
  const actions = (br) => [["tap", "Tap", br.tap], ["hold", "Hold", br.hold], ["long", "Long hold", br.long]]
    .filter(([, , v]) => v)
    .map(([kind, label, v]) => `<div class="hc-act">
      <span class="hc-stage">${tierDot(kind)}${label}</span>
      <span><span class="hc-target">${esc(v[0])}</span> <span class="hc-life">${esc(v[1])}</span></span></div>`).join("");
  if (beh) sections.push(`<div class="hc-sect"><div class="hc-h">Key behaviour</div>
    <div class="hc-sub">${esc(beh.title)} · ${beh.branches.length} branch${beh.branches.length === 1 ? "" : "es"} · tap/hold ${beh.tapHold || "default"} ms${beh.anchor ? " · keeps auto-mouse anchored" : ""}</div>
    ${beh.branches.map(br => {
      const count = FEEDBACK.find(f => f.k === `Tap count ${br.n}`);
      return `<div class="hc-branch"><span class="hc-n" style="${count && lit && !isOff(count.hsv) ? `border-color:${css(count.hsv)};color:${css(count.hsv)}` : ""}">${br.n}×</span><div>${actions(br)}</div></div>`;
    }).join("")}
    <div class="hc-sub" style="margin:7px 0 0">${lit
      ? "The dot beside each tier is the colour the keyboard flashes on this key when that tier resolves."
      : "Key feedback is switched off, so none of these flash on the keyboard."}</div></div>`);
  if (macro) {
    const row = MACROS.find(m => m.n === Number(macro[1]));
    sections.push(`<div class="hc-sect"><div class="hc-h">Macro payload</div>
      <div class="hc-sub">VIA macro ${macro[1]} · ${row ? row.bytes + " bytes · " + row.steps.length + " steps" : "empty slot"}</div>
      ${row ? row.steps.slice(0, 4).map(([k, v]) => `<div class="hc-step"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join("")
            : `<div class="hc-empty">Nothing stored in this slot.</div>`}</div>`);
  }
  if (pd) sections.push(`<div class="hc-sect"><div class="hc-h">Pointing mode</div>
    <div class="hc-flow"><span class="swatch-lg" style="width:12px;height:12px;border-radius:4px;background:${css(pd.hsv)}"></span>
      <span>${esc(pd.name)}</span><span class="hc-life">${pd.kind === 2 ? "scrolling" : "directional · " + pd.axis}</span></div>
    <div class="hc-sub" style="margin:6px 0 0">Held while this key is down; ${esc(pd.bind)}_LOCK toggles it. While it runs, its colour paints the ${esc(pd.locality.toLowerCase())} — not this key.</div></div>`);
  if (combos.length) sections.push(`<div class="hc-sect"><div class="hc-h">Combos</div>
    ${combos.map(c => `<div class="hc-flow"><span class="hc-chip">${c.id}</span>
      ${c.inputs.map(i => `<span class="hc-chip">${esc(face(i))}</span>`).join('<span class="hc-life">+</span>')}
      <span class="hc-life">→</span><span class="hc-chip out">${esc(face(c.out))}</span>
      <span class="hc-life">${c.win} ms${c.req !== "—" ? " · " + c.req : ""}</span></div>`).join("")}</div>`);
  sections.push(`<div class="hc-sect"><div class="hc-h">Light</div>
    <div class="hc-flow"><span class="swatch-lg ${isOff(layer.hsv) ? "swatch-off" : ""}" style="width:12px;height:12px;border-radius:4px;${isOff(layer.hsv) ? "" : `background:${css(layer.hsv)}`}"></span>
      <span class="hc-life">${layer.pass ? "passes through · base effect shows" : `${layer.name} · HSV(${layer.hsv.join(", ")})`}${
        code === "_______" ? " · transparent keys stay unlit on a mapped-keys-only layer" : ""}</span></div></div>`);
  if (!beh && !combos.length && !macro && !pd) sections.splice(0, 0,
    `<div class="hc-sect"><div class="hc-empty">No key behaviour, macro, combo or pointing mode on this key.</div></div>`);
  return `<div class="hc-head"><div class="hc-title"><span class="t">${esc(f.main || "Unmapped")}</span>
      <span class="hc-pill">index ${index}</span></div>
      <code class="hc-code">${esc(code)}${f.sub ? " · " + esc(f.sub) : ""}</code></div>${sections.join("")}`;
}

document.addEventListener("mouseover", (event) => {
  const key = event.target.closest?.("[data-key]");
  const tip = event.target.closest?.("[data-tip]");
  clearTimeout(tipTimer);
  if (key && S.screen === "keys") {
    const rect = key.getBoundingClientRect();
    tipTimer = setTimeout(() => { cardNode.innerHTML = keyCardHtml(Number(key.dataset.key)); place(cardNode, rect, 14, true); }, 140);
    tipNode.hidden = true;
    return;
  }
  cardNode.hidden = true;
  if (tip) {
    const rect = tip.getBoundingClientRect();
    tipTimer = setTimeout(() => { tipNode.textContent = tip.dataset.tip; place(tipNode, rect, 8); }, 260);
    return;
  }
  tipNode.hidden = true;
});
document.addEventListener("mouseout", (event) => { if (!event.relatedTarget || event.relatedTarget === document.documentElement) hideHover(); });
addEventListener("scroll", hideHover, true);
addEventListener("keydown", (e) => { if (e.key === "Escape") { hideHover(); if (S.overlay) { S.overlay = null; render(); } } });

/* ── render ──────────────────────────────────────────────────────────── */
const SCREENS = {keys: screenKeys, pointing: screenPointing, lighting: screenLighting, macros: screenMacros,
  settings: screenSettings, profile: screenProfile, device: screenDevice};
function render() {
  hideHover();
  const root = document.getElementById("root");
  root.replaceChildren();
  const app = el(`<div class="app"></div>`);
  app.appendChild(rail());
  const screen = (SCREENS[S.screen] || screenKeys)();
  if (S.notice) {
    const error = S.notice === "error";
    const bar = el(`<div class="notice ${error ? "err" : ""}" role="status">
      <i class="dot ${error ? "err" : "on"}"></i>
      <span>${error
        ? "The keyboard disconnected while applying. Its saved profile is untouched and your draft is intact — reconnect and review before applying again."
        : "Applied. Both halves confirmed generation 43 and the recovery copy was released."}</span>
      <button class="btn tiny ghost" data-dismiss style="margin-left:auto">${error ? "Reconnect" : "Dismiss"}</button></div>`);
    bar.querySelector("[data-dismiss]").addEventListener("click", () => { S.notice = null; render(); });
    screen.querySelector(".content")?.prepend(bar);
  }
  app.appendChild(screen);
  root.appendChild(app);
  if (S.overlay === "review") root.appendChild(overlayReview());
  if (S.overlay === "picker") root.appendChild(overlayPicker());
  if (S.overlay === "notes") root.appendChild(overlayNotes());
  if (S.overlay === "import") root.appendChild(overlayImport());
  // a stills-and-demo affordance: #keys?hover=50 opens the hover card on load
  if (S.comboOpen && S.screen === "keys" && !S.overlay) requestAnimationFrame(() => {
    // scroll the inspector, never the page: the board has to stay visible
    const sect = document.querySelector("#comboSect"), body = sect?.closest(".insp-body");
    if (sect && body) body.scrollTop += sect.getBoundingClientRect().top - body.getBoundingClientRect().top - 8;
  });
  if (S.hoverDemo !== undefined && S.screen === "keys" && !S.overlay) requestAnimationFrame(() => {
    const key = document.querySelector(`[data-key="${S.hoverDemo}"]`);
    if (key) { cardNode.innerHTML = keyCardHtml(S.hoverDemo); place(cardNode, key.getBoundingClientRect(), 14, true); }
  });
}
/* Deep links: #lighting, #keys?light, #review … so a screen can be opened,
   shared, or rendered to an image without clicking through the app. */
function applyHash() {
  const [screen, query] = decodeURIComponent(location.hash.slice(1)).split("?");
  if (SCREENS[screen]) S.screen = screen;
  if (["review", "picker", "notes", "import"].includes(screen)) S.overlay = screen;
  const q = new URLSearchParams(query || "");
  if (q.has("layer")) S.layer = Number(q.get("layer"));
  if (q.has("stage")) S.stage = q.get("stage");
  if (q.has("pd")) S.pd = Number(q.get("pd"));
  if (q.has("hover")) S.hoverDemo = Number(q.get("hover"));
  if (q.has("lm")) S.stage = q.get("lm") === "groups" ? "groups" : S.stage;
  if (q.has("pdpreview")) S.pdPreview = true;
  if (q.has("fb")) S.fbRow = Number(q.get("fb"));
  if (q.has("stageoff")) q.get("stageoff").split(",").forEach(id => { const st = STAGES.find(x => x.id === id); if (st) st.on = false; });
  if (q.has("comboon")) { const st = STAGES.find(x => x.id === "combo"); if (st) st.on = true; COMBO_FEEDBACK.hsv = [222, 255, 200]; }
  if (q.has("tab")) S.tab = q.get("tab");
  if (q.has("row")) S.behRow = q.get("row");
  if (q.has("cell")) S.cell = q.get("cell");
  if (q.has("key")) S.selected = Number(q.get("key"));
  if (q.has("combo")) { S.comboOpen = true; S.comboPicking = q.get("combo") === "picking"; }
  if (q.has("notice")) S.notice = q.get("notice");
  if (q.has("state")) { S.stale = q.get("state") === "stale"; S.applying = q.get("state") === "applying"; }
  if (q.has("layeradd")) S.layerAdd = true;
  if (q.has("theme")) document.documentElement.dataset.theme = q.get("theme");
}
window.addEventListener("hashchange", () => { S.overlay = null; applyHash(); render(); });
document.getElementById("themeBtn").addEventListener("click", (e) => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  e.target.textContent = next === "dark" ? "Light" : "Dark";
});
document.getElementById("notesBtn").addEventListener("click", () => { S.overlay = "notes"; render(); });
applyHash();
render();
</script>

.main { position: relative; }
details > summary::-webkit-details-marker { display: none; }
details > summary { list-style: none; }
