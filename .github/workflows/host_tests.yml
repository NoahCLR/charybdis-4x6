name: Firmware host suite

# Development runs the host suite with macOS clang; the release build runs it
# with GCC in the QMK container. Running it here on every dev push and pull
# request catches compiler differences long before a release tag, and gives
# promote --push a dev result to require.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Host suite (GCC)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/noahclr/qmk_base_container:debian13-qmk1.1.8
    steps:
      - name: Checkout userspace
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Checkout QMK fork trunk
        uses: actions/checkout@v6
        with:
          path: qmk_firmware
          repository: NoahCLR/bastardkb-qmk
          ref: noah-userspace-contracts
          persist-credentials: false
          submodules: recursive

      - name: Configure Git safe directories and QMK CLI
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/qmk_firmware"
          qmk config user.qmk_home="$GITHUB_WORKSPACE/qmk_firmware"
          qmk config user.overlay_dir="$GITHUB_WORKSPACE"

      - name: Install ripgrep for host-suite guard checks
        run: apt-get update -qq && apt-get install -y -qq ripgrep

      - name: Install Node for diagnostics host tests
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run firmware host suite
        run: QMK_ROOT="$GITHUB_WORKSPACE/qmk_firmware" sh tests/host/run_all_host_tests.sh
