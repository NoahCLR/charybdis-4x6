name: Build Binaries

on:
  workflow_call:
    inputs:
      qmk_repo:
        description: "qmk_firmware repo to build against"
        default: "qmk/qmk_firmware"
        required: false
        type: string
      qmk_ref:
        description: "qmk_firmware branch to build against"
        default: "master"
        required: false
        type: string
      preparation_command:
        description: "command to execute before the firmware pair build"
        default: ""
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Userspace Firmware
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/noahclr/qmk_base_container:debian13-qmk1.1.8

    steps:
      - name: Checkout Userspace
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
          submodules: recursive

      - name: Checkout QMK Firmware
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
          path: qmk_firmware
          repository: ${{ inputs.qmk_repo || 'qmk/qmk_firmware' }}
          ref: ${{ inputs.qmk_ref || 'master' }}
          submodules: recursive

      - name: Configure Git safe directories
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/qmk_firmware"

      - name: Require BK at the commit qmk-pin.json names
        # A release tag on BK must be exactly the pinned commit; the pair build
        # also refuses anything else.
        run: |
          pin="$(python3 -c 'import json; print(json.load(open("qmk-pin.json"))["commit"])')"
          head="$(git -C qmk_firmware rev-parse HEAD)"
          test "$head" = "$pin" || { echo "BK checkout is $head, but qmk-pin.json pins $pin" >&2; exit 1; }
          echo "Built with bastardkb-qmk @ $pin" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure QMK CLI
        run: |
          qmk config user.qmk_home="$GITHUB_WORKSPACE/qmk_firmware"
          qmk config user.overlay_dir="$GITHUB_WORKSPACE"

      - name: Validate userspace
        run: |
          qmk userspace-doctor

      - name: Preparation command
        if: inputs.preparation_command != ''
        run: |
          ${{ inputs.preparation_command }}

      - name: Install ripgrep for host-suite guard checks
        run: apt-get update -qq && apt-get install -y -qq ripgrep

      - name: Install Node for diagnostics host tests
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run firmware host suite
        run: QMK_ROOT="$GITHUB_WORKSPACE/qmk_firmware" sh tests/host/run_all_host_tests.sh

      - name: Build flashable left and right firmware
        run: |
          QMK_ROOT="$GITHUB_WORKSPACE/qmk_firmware" \
            OUTPUT_DIR="$GITHUB_WORKSPACE" \
            sh tools/build-release-firmware-pair.sh

      - name: State the firmware contract
        run: QMK_ROOT="$GITHUB_WORKSPACE/qmk_firmware" sh tests/host/run_contract_probe.sh --output "$GITHUB_WORKSPACE/firmware-contract.json"

      - name: Upload firmware pair
        uses: actions/upload-artifact@v7
        with:
          name: Firmware
          if-no-files-found: error
          path: |
            bastardkb_charybdis_4x6_noah_left.uf2
            bastardkb_charybdis_4x6_noah_right.uf2
            firmware-contract.json
