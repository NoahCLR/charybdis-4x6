name: Firmware CI

# Development is verified locally (the work-queue vault's verify), so nothing
# runs on dev pushes or pull requests into dev. A release's dev → main pull
# request runs everything main requires: the GCC host suite, the pair build
# whose files the release publishes, and agreement with the Ark release it
# will sit next to (D-F06). Nightly runs check dev and BK drift; they never
# block. Scheduled runs start from the default branch (main), so they check
# out dev explicitly.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"

permissions:
  contents: read

jobs:
  host:
    name: Host suite (GCC)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/noahclr/qmk_base_container:debian13-qmk1.1.8@sha256:c21e0fc2229613f7e9d633a6b879f7e1f5aacaa18330fbe2593ddba26f030245
    steps:
      - name: Checkout userspace
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          persist-credentials: false
          submodules: recursive

      - name: Read the pinned BK commit
        id: pin
        run: python3 -c 'import json; print("commit=" + json.load(open("qmk-pin.json"))["commit"])' >> "$GITHUB_OUTPUT"

      - name: Checkout BK at the pin
        uses: actions/checkout@v6
        with:
          path: qmk_firmware
          repository: NoahCLR/bastardkb-qmk
          ref: ${{ steps.pin.outputs.commit }}
          persist-credentials: false
          submodules: recursive

      - name: Configure Git safe directories and QMK CLI
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/qmk_firmware"
          qmk config user.qmk_home="$GITHUB_WORKSPACE/qmk_firmware"
          qmk config user.overlay_dir="$GITHUB_WORKSPACE"

      - name: Install ripgrep for host-suite guard checks
        run: apt-get update -qq && apt-get install -y -qq ripgrep

      - name: Install Node for diagnostics host tests
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run firmware host suite
        run: QMK_ROOT="$GITHUB_WORKSPACE/qmk_firmware" sh tests/host/run_all_host_tests.sh

  pair:
    # The release publishes these exact files: built in the release image at
    # the pin, reproducibly, so they equal a local pair of the same commit.
    name: Pair build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/noahclr/qmk_base_container:debian13-qmk1.1.8@sha256:c21e0fc2229613f7e9d633a6b879f7e1f5aacaa18330fbe2593ddba26f030245
    steps:
      - name: Checkout userspace
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Read the pinned BK commit
        id: pin
        run: python3 -c 'import json; print("commit=" + json.load(open("qmk-pin.json"))["commit"])' >> "$GITHUB_OUTPUT"

      - name: Checkout BK at the pin
        uses: actions/checkout@v6
        with:
          path: qmk_firmware
          repository: NoahCLR/bastardkb-qmk
          ref: ${{ steps.pin.outputs.commit }}
          persist-credentials: false
          submodules: recursive

      - name: Configure Git safe directories
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/qmk_firmware"

      # The pair stays inside the workspace and is uploaded by relative paths:
      # in a container job, ${{ runner.temp }} names the host's path, not the
      # container's, and the upload would miss files.
      - name: Build the flashable pair
        run: |
          QMK_ROOT="$GITHUB_WORKSPACE/qmk_firmware" OUTPUT_DIR="$GITHUB_WORKSPACE/release-pair" \
            sh tools/build-release-firmware-pair.sh

      - name: State the firmware contract
        run: QMK_ROOT="$GITHUB_WORKSPACE/qmk_firmware" sh tests/host/run_contract_probe.sh --output "$GITHUB_WORKSPACE/release-pair/firmware-contract.json"

      - name: Record what was built
        run: |
          cd release-pair
          sha256sum bastardkb_charybdis_4x6_noah_left.uf2 bastardkb_charybdis_4x6_noah_right.uf2 > SHA256SUMS
          {
            echo "Built at BK ${{ steps.pin.outputs.commit }} with $(arm-none-eabi-gcc --version | head -n 1)"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the pair for the release
        uses: actions/upload-artifact@v7
        with:
          name: firmware-pair
          if-no-files-found: error
          retention-days: 90
          path: |
            release-pair/bastardkb_charybdis_4x6_noah_left.uf2
            release-pair/bastardkb_charybdis_4x6_noah_right.uf2
            release-pair/firmware-contract.json
            release-pair/SHA256SUMS

  agreement:
    # Ark judges this firmware's contract with its own code (D-F06): against
    # Ark main, or Ark dev when the release marker says it is a joint release.
    # Firmware code and tests never read the app; only this release gate does.
    name: Agreement with Ark main
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout firmware
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Which Ark this release sits next to
        id: ark
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json, os, re
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          body = (event.get('pull_request') or {}).get('body') or ''
          marker = re.search(r'<!-- charybdis-release (\{.*?\}) -->', body)
          joint = marker and json.loads(marker.group(1)).get('joint') == 'ark'
          print('ref=' + ('dev' if joint else 'main'))
          PYTHON

      - name: Checkout Ark
        uses: actions/checkout@v6
        with:
          repository: NoahCLR/charybdis-ark
          ref: ${{ steps.ark.outputs.ref }}
          path: .ci/ark
          persist-credentials: false

      - name: Read the pinned BK commit
        id: pin
        run: python3 -c 'import json; print("commit=" + json.load(open("qmk-pin.json"))["commit"])' >> "$GITHUB_OUTPUT"

      - name: Checkout BK at the pin
        uses: actions/checkout@v6
        with:
          repository: NoahCLR/bastardkb-qmk
          ref: ${{ steps.pin.outputs.commit }}
          path: .ci/qmk
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .ci/ark/.nvmrc

      - name: Judge this firmware's contract with Ark ${{ steps.ark.outputs.ref }}
        run: node .ci/ark/scripts/check-agreement.js --firmware "$GITHUB_WORKSPACE" --qmk .ci/qmk --markdown "$RUNNER_TEMP/agreement.md"

      - name: Show the agreement table
        if: always()
        run: cat "$RUNNER_TEMP/agreement.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  bk-head:
    # Early warning, never required: firmware dev against the BK dev branch as
    # it is now. Red means BK moved in a way firmware must follow before re-pinning.
    name: Host suite with the BK dev head (early warning)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/noahclr/qmk_base_container:debian13-qmk1.1.8@sha256:c21e0fc2229613f7e9d633a6b879f7e1f5aacaa18330fbe2593ddba26f030245
    steps:
      - name: Checkout userspace
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          persist-credentials: false
          submodules: recursive

      - name: Checkout the BK dev head
        uses: actions/checkout@v6
        with:
          path: qmk_firmware
          repository: NoahCLR/bastardkb-qmk
          ref: noah-userspace-contracts-dev
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Configure Git safe directories and QMK CLI
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/qmk_firmware"
          qmk config user.qmk_home="$GITHUB_WORKSPACE/qmk_firmware"
          qmk config user.overlay_dir="$GITHUB_WORKSPACE"

      - name: Report how far the BK dev head is ahead of the pin
        run: |
          pin="$(python3 -c 'import json; print(json.load(open("qmk-pin.json"))["commit"])')"
          ahead="$(git -C qmk_firmware rev-list --count "$pin..HEAD")"
          echo "BK dev head is $ahead commit(s) ahead of the pin $pin." >> "$GITHUB_STEP_SUMMARY"

      - name: Install ripgrep for host-suite guard checks
        run: apt-get update -qq && apt-get install -y -qq ripgrep

      - name: Install Node for diagnostics host tests
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run firmware host suite against the BK dev head
        run: QMK_ROOT="$GITHUB_WORKSPACE/qmk_firmware" sh tests/host/run_all_host_tests.sh
