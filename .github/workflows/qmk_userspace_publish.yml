name: Build Binaries

on:
  workflow_call:
    inputs:
      release_name:
        description: "allow setting the release name"
        default: "latest"
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: Firmware

      - name: Verify both halves are present
        run: |
          test -s bastardkb_charybdis_4x6_noah_left.uf2
          test -s bastardkb_charybdis_4x6_noah_right.uf2
          test -s firmware-contract.json

      - name: Attach pair to draft release
        # Third-party action with write access: pinned to a reviewed commit.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          token: ${{ github.token }}
          name: Charybdis 4x6 ${{ inputs.release_name }}
          tag_name: ${{ inputs.release_name || 'latest' }}
          fail_on_unmatched_files: true
          draft: true
          prerelease: false
          files: |
            bastardkb_charybdis_4x6_noah_left.uf2
            bastardkb_charybdis_4x6_noah_right.uf2
            firmware-contract.json
