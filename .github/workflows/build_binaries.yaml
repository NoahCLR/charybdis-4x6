name: Build QMK firmware

# Builds run locally during development (tools/build-firmware-pair.sh).
# CI builds only a release tag, or on demand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pin:
    name: "Read the BK pin"
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: pin
        run: python3 -c 'import json; print("commit=" + json.load(open("qmk-pin.json"))["commit"])' >> "$GITHUB_OUTPUT"

  build:
    name: "QMK Userspace Build"
    needs: pin
    uses: ./.github/workflows/qmk_userspace_build.yml
    with:
      qmk_repo: NoahCLR/bastardkb-qmk
      # A release tag exists on BK too and must be the pinned commit (the build
      # checks); otherwise build exactly the pin.
      qmk_ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || needs.pin.outputs.commit }}

  publish:
    name: "QMK Userspace Publish"
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    uses: ./.github/workflows/qmk_userspace_publish.yml
    with:
      release_name: ${{ github.ref_name }}
