name: Build QMK firmware

# Builds run locally during development (tools/build-firmware-pair.sh).
# CI builds only a release tag, or on demand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "QMK Userspace Build"
    uses: ./.github/workflows/qmk_userspace_build.yml
    with:
      qmk_repo: NoahCLR/bastardkb-qmk
      qmk_ref: noah-userspace-contracts

  publish:
    name: "QMK Userspace Publish"
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    uses: ./.github/workflows/qmk_userspace_publish.yml
    with:
      release_name: ${{ github.ref_name }}
